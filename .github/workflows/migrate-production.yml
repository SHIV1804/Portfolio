name: Migrate production database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Require main ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "This workflow must be run from refs/heads/main; refusing to continue (received $GITHUB_REF)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Create Neon backup branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          name="pre-migrate-${GITHUB_RUN_ID}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"branch\":{\"name\":\"${name}\"}}")
          if [ "$code" -ge 300 ]; then echo "Neon backup failed (HTTP $code); aborting"; exit 1; fi
          echo "Backup branch created: ${name}"
      - name: Show pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          set +e
          status_output=$(npx prisma migrate status 2>&1)
          status_code=$?
          set -e
          printf '%s\n' "$status_output"
          if [ "$status_code" -ne 0 ]; then
            if printf '%s\n' "$status_output" | grep -Eqi 'pending migrations|not yet been applied|database schema is not up to date'; then
              echo "Pending migrations detected; continuing to prisma migrate deploy."
            else
              echo "prisma migrate status failed; aborting."
              exit "$status_code"
            fi
          fi
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        run: npx prisma migrate deploy
